<!DOCTYPE html>
<!-- Declara o tipo de documento como HTML5 -->

<html lang="pt-br">
<!-- Define o idioma da página como português do Brasil -->

<head>
  <meta charset="UTF-8" />
  <!-- Define a codificação de caracteres como UTF-8 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Garante que o layout seja responsivo em diferentes dispositivos -->

  <title>Administradores</title>
  <!-- Define o título da aba do navegador -->

  <link rel="stylesheet" href="Admin.css">
  <!-- Importa o arquivo de estilos CSS externo -->
</head>

<body>
  <!-- Corpo principal da página -->

  <div class="container">
    <!-- Container principal que agrupa a sidebar e o conteúdo principal -->

    <aside class="sidebar">
      <!-- Barra lateral com opções de navegação -->

        <h2>ADMINISTRADORES</h2>
        <div class="header-actions">

          <button class="export-btn">EXPORTAR</button>

      </div>

            <th>Código</th>

            <th>Ativo</th>
            <th>Ações</th>

        </thead>
        <tbody>
          <!-- Corpo da tabela com os dados dos administradores -->
          <tr>
            <td>1</td>

              <button class="edit-btn">✏️</button>

          <!-- Segunda linha da tabela -->

            <td>2</td>

            </td>
          </tr>

          <!-- Terceira linha da tabela -->
          <tr>
            <td>3</td>
            <td>Rian Souza</td>
            <td>Rian</td>
            <td>sim</td>
            <td>
              <button class="action-btn">PERMISSÃO</button>
              <button class="edit-btn">✏️</button>
            </td>
          </tr>

          <!-- Outras linhas podem ser adicionadas conforme necessário -->
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
